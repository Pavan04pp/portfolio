<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="50%" stop-color="#111118"/>
      <stop offset="100%" stop-color="#0d0d14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16162a"/>
    </linearGradient>
    <linearGradient id="docGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1e36"/>
      <stop offset="100%" stop-color="#14142a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" rx="16" fill="url(#bg)"/>

  <!-- Ambient glow orbs -->
  <circle cx="200" cy="150" r="200" fill="#ef4444" opacity="0.04" filter="url(#glow)"/>
  <circle cx="1000" cy="600" r="250" fill="#8b5cf6" opacity="0.03" filter="url(#glow)"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="1200" height="56" rx="16" fill="#0f0f1a" opacity="0.9"/>
  <rect x="0" y="40" width="1200" height="16" fill="#0f0f1a" opacity="0.9"/>
  <rect x="0" y="55" width="1200" height="1" fill="#ffffff" opacity="0.05"/>

  <!-- Nav logo -->
  <circle cx="36" cy="28" r="10" fill="#ef4444" opacity="0.8"/>
  <text x="56" y="33" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#ffffff">LegalEase AI</text>
  <text x="800" y="33" font-family="system-ui, sans-serif" font-size="13" fill="#9ca3af">Dashboard</text>
  <text x="890" y="33" font-family="system-ui, sans-serif" font-size="13" fill="#ef4444">Documents</text>
  <text x="985" y="33" font-family="system-ui, sans-serif" font-size="13" fill="#9ca3af">Analysis</text>

  <!-- Sidebar -->
  <rect x="0" y="56" width="240" height="744" fill="#0c0c18" opacity="0.7"/>
  <rect x="239" y="56" width="1" height="744" fill="#ffffff" opacity="0.05"/>

  <!-- Upload button -->
  <rect x="16" y="76" width="208" height="36" rx="8" fill="#ef4444" opacity="0.12"/>
  <text x="52" y="99" font-family="system-ui, sans-serif" font-size="13" fill="#ef4444">+ Upload Document</text>

  <!-- Sidebar items -->
  <text x="52" y="143" font-family="system-ui, sans-serif" font-size="13" fill="#9ca3af">Recent Files</text>
  <text x="52" y="175" font-family="system-ui, sans-serif" font-size="13" fill="#9ca3af">AI Summaries</text>
  <text x="52" y="207" font-family="system-ui, sans-serif" font-size="13" fill="#9ca3af">Risk Analysis</text>

  <text x="28" y="260" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#6b7280" letter-spacing="1">RECENT DOCUMENTS</text>

  <rect x="16" y="274" width="208" height="40" rx="6" fill="#ffffff" opacity="0.03"/>
  <text x="28" y="292" font-family="system-ui, sans-serif" font-size="12" fill="#d1d5db">NDA_Agreement.pdf</text>
  <text x="28" y="306" font-family="system-ui, sans-serif" font-size="10" fill="#6b7280">Analyzed • 2 min ago</text>

  <rect x="16" y="322" width="208" height="40" rx="6" fill="#ffffff" opacity="0.02"/>
  <text x="28" y="340" font-family="system-ui, sans-serif" font-size="12" fill="#9ca3af">Employment_Contract.pdf</text>
  <text x="28" y="354" font-family="system-ui, sans-serif" font-size="10" fill="#6b7280">Analyzed • 1 hour ago</text>

  <!-- Document preview panel -->
  <rect x="260" y="76" width="520" height="704" rx="12" fill="url(#docGrad)" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
  <text x="284" y="108" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e5e7eb">NDA_Agreement.pdf</text>
  <rect x="680" y="90" width="80" height="26" rx="13" fill="#ef4444" opacity="0.15"/>
  <text x="700" y="108" font-family="system-ui, sans-serif" font-size="11" fill="#ef4444">3 Risks</text>
  <rect x="284" y="120" width="472" height="1" fill="#ffffff" opacity="0.05"/>

  <!-- Document text -->
  <text x="284" y="148" font-family="Georgia, serif" font-size="12" fill="#9ca3af" opacity="0.7">ARTICLE 1. DEFINITIONS</text>
  <text x="284" y="170" font-family="Georgia, serif" font-size="11.5" fill="#d1d5db" opacity="0.5">"Confidential Information" shall mean any data or</text>
  <text x="284" y="186" font-family="Georgia, serif" font-size="11.5" fill="#d1d5db" opacity="0.5">information, oral or written, treated as confidential...</text>

  <!-- Green clause -->
  <rect x="276" y="202" width="490" height="32" rx="4" fill="#22c55e" opacity="0.08"/>
  <rect x="276" y="202" width="3" height="32" rx="1" fill="#22c55e" opacity="0.6"/>
  <text x="288" y="216" font-family="Georgia, serif" font-size="11.5" fill="#86efac">The receiving party agrees to protect confidential</text>
  <text x="288" y="230" font-family="Georgia, serif" font-size="11.5" fill="#86efac">information with reasonable care and diligence.</text>

  <text x="284" y="256" font-family="Georgia, serif" font-size="12" fill="#9ca3af" opacity="0.7">ARTICLE 2. NON-DISCLOSURE OBLIGATIONS</text>
  <text x="284" y="278" font-family="Georgia, serif" font-size="11.5" fill="#d1d5db" opacity="0.5">The Receiving Party shall not disclose, publish or</text>
  <text x="284" y="294" font-family="Georgia, serif" font-size="11.5" fill="#d1d5db" opacity="0.5">otherwise reveal any of the Confidential Information...</text>

  <!-- Red clause (risk) -->
  <rect x="276" y="310" width="490" height="48" rx="4" fill="#ef4444" opacity="0.08"/>
  <rect x="276" y="310" width="3" height="48" rx="1" fill="#ef4444" opacity="0.6"/>
  <text x="288" y="328" font-family="Georgia, serif" font-size="11.5" fill="#fca5a5">Non-compete clause extends 5 years post-termination</text>
  <text x="288" y="344" font-family="Georgia, serif" font-size="11.5" fill="#fca5a5">across all territories without geographic limitation.</text>

  <text x="284" y="382" font-family="Georgia, serif" font-size="11.5" fill="#d1d5db" opacity="0.5">Each party acknowledges that any violation of this</text>
  <text x="284" y="398" font-family="Georgia, serif" font-size="11.5" fill="#d1d5db" opacity="0.5">agreement may result in irreparable harm...</text>

  <!-- Yellow clause -->
  <rect x="276" y="414" width="490" height="32" rx="4" fill="#eab308" opacity="0.08"/>
  <rect x="276" y="414" width="3" height="32" rx="1" fill="#eab308" opacity="0.6"/>
  <text x="288" y="428" font-family="Georgia, serif" font-size="11.5" fill="#fde047">Automatic renewal clause — review termination terms</text>
  <text x="288" y="444" font-family="Georgia, serif" font-size="11.5" fill="#fde047">to ensure 60-day notice period is maintained.</text>

  <text x="284" y="470" font-family="Georgia, serif" font-size="12" fill="#9ca3af" opacity="0.7">ARTICLE 3. TERM AND TERMINATION</text>
  <text x="284" y="492" font-family="Georgia, serif" font-size="11.5" fill="#d1d5db" opacity="0.5">This Agreement shall commence on the Effective Date</text>
  <text x="284" y="508" font-family="Georgia, serif" font-size="11.5" fill="#d1d5db" opacity="0.5">and shall continue for an initial period of two (2)...</text>

  <!-- Green clause -->
  <rect x="276" y="524" width="490" height="32" rx="4" fill="#22c55e" opacity="0.08"/>
  <rect x="276" y="524" width="3" height="32" rx="1" fill="#22c55e" opacity="0.6"/>
  <text x="288" y="538" font-family="Georgia, serif" font-size="11.5" fill="#86efac">Standard indemnification clause with mutual obligations</text>
  <text x="288" y="554" font-family="Georgia, serif" font-size="11.5" fill="#86efac">— balanced and fair to both parties.</text>

  <!-- Red clause -->
  <rect x="276" y="614" width="490" height="32" rx="4" fill="#ef4444" opacity="0.08"/>
  <rect x="276" y="614" width="3" height="32" rx="1" fill="#ef4444" opacity="0.6"/>
  <text x="288" y="628" font-family="Georgia, serif" font-size="11.5" fill="#fca5a5">Unlimited liability clause — consider capping damages</text>
  <text x="288" y="644" font-family="Georgia, serif" font-size="11.5" fill="#fca5a5">to the total contract value for risk mitigation.</text>

  <!-- Right Panel: AI Summary -->
  <rect x="800" y="76" width="380" height="340" rx="12" fill="url(#cardBg)" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
  <circle cx="824" cy="100" r="10" fill="#ef4444" opacity="0.25"/>
  <text x="824" y="104" font-family="system-ui, sans-serif" font-size="10" fill="#ef4444" text-anchor="middle">AI</text>
  <text x="842" y="104" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e5e7eb">AI Summary</text>
  <rect x="816" y="116" width="348" height="1" fill="#ffffff" opacity="0.05"/>

  <text x="816" y="140" font-family="system-ui, sans-serif" font-size="12" fill="#d1d5db">This NDA contains standard confidentiality</text>
  <text x="816" y="156" font-family="system-ui, sans-serif" font-size="12" fill="#d1d5db">provisions with several areas of concern:</text>

  <!-- Risk items -->
  <rect x="816" y="172" width="348" height="36" rx="6" fill="#ef4444" opacity="0.06"/>
  <circle cx="832" cy="190" r="5" fill="#ef4444" opacity="0.7"/>
  <text x="846" y="186" font-family="system-ui, sans-serif" font-size="11" fill="#fca5a5" font-weight="600">High Risk</text>
  <text x="846" y="200" font-family="system-ui, sans-serif" font-size="10.5" fill="#9ca3af">Non-compete: 5yr, no geographic limit</text>

  <rect x="816" y="216" width="348" height="36" rx="6" fill="#ef4444" opacity="0.06"/>
  <circle cx="832" cy="234" r="5" fill="#ef4444" opacity="0.7"/>
  <text x="846" y="230" font-family="system-ui, sans-serif" font-size="11" fill="#fca5a5" font-weight="600">High Risk</text>
  <text x="846" y="244" font-family="system-ui, sans-serif" font-size="10.5" fill="#9ca3af">Unlimited liability exposure</text>

  <rect x="816" y="260" width="348" height="36" rx="6" fill="#eab308" opacity="0.06"/>
  <circle cx="832" cy="278" r="5" fill="#eab308" opacity="0.7"/>
  <text x="846" y="274" font-family="system-ui, sans-serif" font-size="11" fill="#fde047" font-weight="600">Medium Risk</text>
  <text x="846" y="288" font-family="system-ui, sans-serif" font-size="10.5" fill="#9ca3af">Auto-renewal without clear opt-out</text>

  <rect x="816" y="304" width="348" height="36" rx="6" fill="#22c55e" opacity="0.06"/>
  <circle cx="832" cy="322" r="5" fill="#22c55e" opacity="0.7"/>
  <text x="846" y="318" font-family="system-ui, sans-serif" font-size="11" fill="#86efac" font-weight="600">Low Risk</text>
  <text x="846" y="332" font-family="system-ui, sans-serif" font-size="10.5" fill="#9ca3af">Standard mutual indemnification</text>

  <!-- Confidence bar -->
  <rect x="816" y="352" width="348" height="44" rx="8" fill="#ffffff" opacity="0.03"/>
  <text x="832" y="372" font-family="system-ui, sans-serif" font-size="11" fill="#9ca3af">AI Confidence Score</text>
  <rect x="832" y="380" width="200" height="6" rx="3" fill="#1f1f3a"/>
  <rect x="832" y="380" width="174" height="6" rx="3" fill="url(#accent)"/>
  <text x="1044" y="389" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ef4444">87%</text>

  <!-- Key Clauses Panel -->
  <rect x="800" y="436" width="380" height="344" rx="12" fill="url(#cardBg)" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
  <text x="824" y="464" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#e5e7eb">Key Clauses Detected</text>
  <rect x="816" y="476" width="348" height="1" fill="#ffffff" opacity="0.05"/>

  <rect x="816" y="492" width="348" height="52" rx="6" fill="#ffffff" opacity="0.02"/>
  <text x="832" y="512" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#d1d5db">Confidentiality Period</text>
  <text x="832" y="530" font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">5 years post-termination</text>
  <rect x="1100" y="502" width="48" height="22" rx="11" fill="#ef4444" opacity="0.15"/>
  <text x="1114" y="517" font-family="system-ui, sans-serif" font-size="10" fill="#ef4444">Risk</text>

  <rect x="816" y="552" width="348" height="52" rx="6" fill="#ffffff" opacity="0.02"/>
  <text x="832" y="572" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#d1d5db">Governing Law</text>
  <text x="832" y="590" font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">State of California, USA</text>
  <rect x="1100" y="562" width="48" height="22" rx="11" fill="#22c55e" opacity="0.15"/>
  <text x="1112" y="577" font-family="system-ui, sans-serif" font-size="10" fill="#22c55e">Safe</text>

  <rect x="816" y="612" width="348" height="52" rx="6" fill="#ffffff" opacity="0.02"/>
  <text x="832" y="632" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#d1d5db">Dispute Resolution</text>
  <text x="832" y="650" font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">Binding arbitration required</text>
  <rect x="1100" y="622" width="48" height="22" rx="11" fill="#eab308" opacity="0.15"/>
  <text x="1108" y="637" font-family="system-ui, sans-serif" font-size="10" fill="#eab308">Warn</text>

  <rect x="816" y="672" width="348" height="52" rx="6" fill="#ffffff" opacity="0.02"/>
  <text x="832" y="692" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#d1d5db">Intellectual Property</text>
  <text x="832" y="710" font-family="system-ui, sans-serif" font-size="11" fill="#6b7280">Clear ownership retained by discloser</text>
  <rect x="1100" y="682" width="48" height="22" rx="11" fill="#22c55e" opacity="0.15"/>
  <text x="1112" y="697" font-family="system-ui, sans-serif" font-size="10" fill="#22c55e">Safe</text>
</svg>
